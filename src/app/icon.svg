<!-- The tape, printed as three rows with the top slot lit. Our own green on our
     own paper — no Spotify logo, wordmark or brand colour is used. Pure
     geometry, so the favicon never depends on a system font being present.

     The unlit rows are #52525b rather than the #3f3f46 used on the full-size
     brand asset: at 16px the darker grey disappears into the tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0a0a0b"/>
  <rect x="6.5" y="9" width="19" height="4" rx="2" fill="#22c55e"/>
  <rect x="6.5" y="14.5" width="14.25" height="4" rx="2" fill="#52525b"/>
  <rect x="6.5" y="20" width="9.5" height="4" rx="2" fill="#52525b"/>
</svg>
